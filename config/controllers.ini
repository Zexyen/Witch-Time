; controllers.ini: pads and keyboard for the native build (read by nnpad_sdl.c; reloaded within a second of being saved).
; Lines starting with ; or # are comments. Names are not case sensitive. Delete this file to get it written again.
;
; Find out what SDL sees:       witch-time-game --pad-test       (devices, GUIDs, live button names)
; Map a pad by pressing keys:   witch-time-game --pad-map 1      (player 1; writes a [device <GUID>] section below)
;
; Pro Controller buttons: A B X Y STICK_L STICK_R L R ZL ZR PLUS MINUS LEFT UP RIGHT DOWN
; Sources on a pad SDL has a mapping for: south east west north back guide start leftstick rightstick leftshoulder
;   rightshoulder dpup dpdown dpleft dpright misc1 rightpaddle1 leftpaddle1 rightpaddle2 leftpaddle2 touchpad misc2..misc6
;   and the axes leftx lefty rightx righty lefttrigger righttrigger (leftx+ / leftx- = the positive / negative half).
; Sources on any device (the device's own numbers, from 0): button<N>  axis<N>[+|-]  hat<N>up|right|down|left

[general]
; Face buttons. positional = the button in Nintendo's A position (right) acts as A: right = A, bottom = B, top = X, left = Y.
;   labels = the printed letter decides (an Xbox pad's A is Pro A; on a PlayStation pad Cross is A, Circle B, Square X,
;   Triangle Y), and the PlayStation / Xbox button pictures follow it. auto = labels for GameCube controllers, positional otherwise.
layout = auto
; Radial dead zone and outer zone of the sticks (fractions of full travel): inside the dead zone nothing, beyond the outer
; zone full deflection; the stick is rescaled in between and its length is limited to 1 (circular gate).
deadzone = 0.10
outer_zone = 0.98
; Trigger travel (0..1) from which ZL / ZR (or any axis mapped to a button) counts as pressed.
trigger_threshold = 0.33
; Vibration: on / off and a strength factor (0..2)
rumble = on
rumble_strength = 1.0
; Button prompts the game shows: auto (follows what you use, at once: a PlayStation pad -> playstation, an Xbox pad -> xbox,
;   other pads -> switch, keyboard or mouse -> keyboard, and no pad -> keyboard), switch, playstation, xbox, keyboard (the keys
;   bound in [keyboard] below). All built in, no mod needed.
button_prompts = auto
; Menus confirm with B and go back with A, and their button prompts show it: on / off. Gameplay keeps its buttons, and the
;   keyboard its keys. Which button is B depends on layout above: with positional, the bottom one (A on an Xbox pad).
swap_confirm = off
; Which input the game takes: both (pads and the keyboard + mouse, merged), keyboard (pads are ignored), controller (the
;   keyboard and mouse are ignored). The keyboard part takes effect when the game starts, the pads part at once.
input = both
; Devices that must never be used (GUIDs from --pad-test; e.g. a keyboard receiver that presents itself as a joystick). One line per device:
; ignore = 03000000efbe00006d04000000000000

[players]
; Which device is player 1..8: auto (first free slot when it connects; a pad that comes back gets its old slot if free),
; a device GUID (from --pad-test; that slot is kept for that device) or none (nobody uses the slot).
player1 = auto
player2 = auto
player3 = auto
player4 = auto
player5 = auto
player6 = auto
player7 = auto
player8 = auto

[keyboard]
; auto = player 1, together with player 1's pad (Bayonetta 3 is a one-player game: it reads only player 1); 1..8 = that
; player (merged with the pad of that player); none = no keyboard.
; The environment variable SSBU_KEYBOARD_PLAYER (0 = none, 1..8) overrides this line. The keyboard counts only while the game window has the focus.
player = auto
; Keys: a letter or digit, LEFT UP RIGHT DOWN ENTER BACKSPACE SPACE TAB ESC SHIFT CTRL ALT LSHIFT RSHIFT LCTRL RCTRL LALT RALT F1..F12,
; NUM0..NUM9, MOUSE1..MOUSE5 (left, right, middle, back, forward), or 0x<virtual key code>; none = unbound. Two keys for one
; button: separated by a comma (A = MOUSE2, ENTER). Pad and keyboard work at the same time (no switch needed). The Pro buttons
; as Bayonetta 3 uses them (the game's Options, Controller page, Type A; another Type there changes them on top of these):
X = MOUSE1
; punch
A = MOUSE2, ENTER
; kick; confirm in menus
B = SPACE, BACKSPACE
; jump; back in menus
Y = E
; shoot (hold)
ZR = LSHIFT
; dodge
ZL = Q, MOUSE4
; Demon Slave (hold, with the attack keys)
L = R
; weapon switch
R = F
; stance change
STICK_R = MOUSE3, V
; camera / lock-on
STICK_L = C
; waypoint
PLUS = ESC
; pause (also lets the mouse go)
MINUS = TAB
; subscreen
; D-pad: left / up / right = Demon Select, down = taunt; moves in menus
LEFT = LEFT, 1
UP = UP, 2
RIGHT = RIGHT, 3
DOWN = DOWN, T
; Left stick (moving; the menus too). A diagonal is as long as a straight push; WALK held = 0.4 of the travel (walking).
LSTICK_LEFT = A
LSTICK_UP = W
LSTICK_RIGHT = D
LSTICK_DOWN = S
WALK = LCTRL
; Right stick (the camera) from keys; the mouse moves it too
RSTICK_LEFT = J
RSTICK_UP = I
RSTICK_RIGHT = L
RSTICK_DOWN = K
; The mouse moves the camera (the right stick) once you click into the game (borderless / fullscreen: at once): the cursor
; is hidden and kept in the window (the capturing click is not passed to the game); Esc (pause) or Alt+Tab lets it go.
; mouse_sensitivity: 1.0 = full stick at 1200 counts a second (a brisk move); mouse_invert_y = on: mouse up = camera down.
mouse_camera = on
mouse_sensitivity = 1.0
mouse_invert_y = off

; Per device (GUID from --pad-test). Every key is optional; what is missing falls back to [general] and the built-in default:
; [device 03000000de280000ff11000000007801]
; name = Example pad
; layout = labels            ; positional | labels | auto
; deadzone = 0.15
; outer_zone = 0.95
; trigger_threshold = 0.5
; rumble = off
; rumble_strength = 0.6
; map.A = south, button7      ; any source(s) for a Pro button; the button is pressed when any of them is
; map.ZL = leftshoulder
; axis.LX = leftx             ; which axis feeds a Pro stick axis (LX LY RX RY)
; invert.LY = on              ; flip it (up is already handled: SDL's y axis is down-positive)
